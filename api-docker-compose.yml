version: '3.8'

services: 
  
  airtel_quiz_zbm_school_api:
    container_name: airtel_quiz_zbm_school_api
    image: python:3.9
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
      - /var/containers/volumes/prod/question-worker-ia/uploads/documents:/uploads/documents/
    expose:
      - 5000
    command: >
      bash -c "pip install -r requirements.txt && python app.py"
    environment:
      - DATABASE_URL=postgresql://ussd:ussd@ussd-postgres/ussd
      # Clé de signature des JWT de session, pilotée depuis Dokploy.
      # Doit être définie là-bas ; sinon l'app retombe sur sa valeur
      # historique (cf. auth_controller.py). La changer invalide les
      # sessions actives. Le dashboard ne la connaît plus — il valide
      # via GET /api/auth/check-session.
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - dokploy-network

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true  # Use the previously created shared network